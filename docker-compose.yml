services:
  backend:
    build:
      context: ./backend
    image: ${IMAGE_REPO:-tinycrm}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # DB_CONNECT in backend/.env points at a local MySQL server. If MySQL runs
    # directly on your PC (not in this compose file) and this backend container
    # also runs via Docker, use host.docker.internal instead of 127.0.0.1 in the
    # DSN so the container can reach the host machine's MySQL.
    env_file:
      - ./backend/.env
    volumes:
      - uploads:/app/uploads
    ports:
      - "4050:4050" # optional — remove if you don't need direct API access
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4050/api/enums || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api # relative path — nginx proxies to backend
    image: ${IMAGE_REPO:-tinycrm}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
